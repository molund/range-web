apiVersion: template.openshift.io/v1
kind: Template
metadata:
  labels:
    build: playwright-runner
  name: playwright-runner
parameters:
  - name: NAME
    description: Name of the ImageStream and BuildConfig
    required: true
    value: playwright-runner
  - name: VERSION
    required: true
    value: "latest"
  # The Git source is only used by `oc start-build` without --from-dir. The workflow always
  # uploads tests/e2e from the checked-out commit instead.
  - name: SOURCE_CONTEXT_DIR
    required: true
    value: tests/e2e
  - name: SOURCE_REPOSITORY_URL
    required: true
    value: https://github.com/bcgov/bcparks.ca
  - name: SOURCE_REPOSITORY_REF
    required: false
    value: main
objects:
  - kind: ImageStream
    apiVersion: image.openshift.io/v1
    metadata:
      name: "${NAME}"
      annotations:
        description: Playwright e2e test image
      labels:
        shared: "true"
    spec:
      lookupPolicy:
        local: false
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: "${NAME}"
    spec:
      output:
        to:
          kind: ImageStreamTag
          name: "${NAME}:${VERSION}"
      resources:
        limits:
          cpu: 2
          memory: 6Gi
        requests:
          cpu: 100m
          memory: 1Gi
      runPolicy: Serial
      source:
        contextDir: "${SOURCE_CONTEXT_DIR}"
        git:
          uri: "${SOURCE_REPOSITORY_URL}"
          ref: "${SOURCE_REPOSITORY_REF}"
        type: Git
      strategy:
        dockerStrategy:
          dockerfilePath: Dockerfile.e2e
          # Overrides the FROM line in Dockerfile.e2e. Keep both in sync with @playwright/test.
          from:
            kind: DockerImage
            name: mcr.microsoft.com/playwright:v1.63.0-noble
        type: Docker
      failedBuildsHistoryLimit: 2
      successfulBuildsHistoryLimit: 2
      # No triggers: builds only start from the workflow (or a manual oc start-build).
      triggers: []
