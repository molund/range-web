kind: List
apiVersion: v1
items:
  # Everything the workflow does happens in tools: start the image build, run the Job,
  # read its logs, and oc cp the results out (pods/exec).
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: playwright-e2e-test-runner
      namespace: "c1643c-tools"
    rules:
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["get", "list", "watch", "create", "delete"]
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["pods/log"]
        verbs: ["get"]
      - apiGroups: [""]
        resources: ["pods/exec"]
        verbs: ["create"]
      - apiGroups: ["build.openshift.io"]
        resources: ["buildconfigs", "builds"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["build.openshift.io"]
        resources: ["buildconfigs/instantiatebinary"]
        verbs: ["create"]
      - apiGroups: ["build.openshift.io"]
        resources: ["builds/log"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["image.openshift.io"]
        resources: ["imagestreams", "imagestreamtags"]
        verbs: ["get", "list", "watch"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: playwright-e2e-test-runner
      namespace: "c1643c-tools"
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: playwright-e2e-test-runner
    subjects:
      - kind: ServiceAccount
        name: githubactions
        namespace: c1643c-tools
